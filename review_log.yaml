# Paper-by-paper review log.
#
# WRITE HERE, READ IN DATA_REVIEW.md. This file is kept by hand; DATA_REVIEW.md
# is generated from the data *and* from this log, so anything written directly
# into that document is erased the next time the tool runs.
#
# The unit is the paper, not the bound file: one entry settles every curve
# transcribed from that paper. Key an entry by the paper's arXiv id where it has
# one and by its DOI otherwise — exactly the identifier DATA_REVIEW.md prints in
# the review queue.
#
#   <identifier>:
#     reviewer: initials or name
#     date: YYYY-MM-DD          # when the paper was read, not when this was typed
#     verdict: ok | corrected | open
#     notes: what was checked, and anything the next reader should know
#     decisions:                # optional, one line per file the review settled
#       <filename>.ecsv: what was decided and why
#
# verdict
#   ok         read against the paper, every curve matches, nothing to change
#   corrected  read, something was wrong, and the fix is committed
#   open       read, something is wrong, and it is not fixed yet — `notes` must
#              say what, because this is the only record of it
#
# What a review checks, per paper:
#   - the reference, DOI, arXiv id and year name the work actually cited
#   - each file's `figure` points at the figure the curve came from
#   - channel, mode, target and confidence agree with that figure
#   - `statement` distinguishes a measurement from a projection
#   - `profile` is filled in if the paper states one, and left empty only if it
#     genuinely does not
#   - `obs_time` carries a number, not a bare unit
#   - the curve itself: monotone in mass, no repeated points, no closed contour

reviewed:
  2111.15009:
    reviewer: Claude and MD
    date: 2026-09-09
    verdict: corrected
    notes: |
      MAGIC combined dSph search, Phys. Dark Univ. 35 (2022) 100912, read against
      all 34 bounds. Claude read the paper and ran the checks; MD re-digitised the
      three curves that had to be replaced.

      Confirmed correct: `figure: "Fig. 4"` on the per-target files — Fig. 4 draws
      Segue 1, Ursa Major II, Draco and Coma Berenices inside each of its nine
      panels, so a per-target curve does come from it; `confidence` 0.95; `mode`;
      `year`; `source: multidsph-4`; and the mass range 70 GeV to 100 TeV. Two
      numbers in the text corroborate the curves: Draco's tautau minimum, 7.4e-24
      at 1.2 TeV, and the combined tautau reaching ~1e-24 in the TeV range.

      The check that did the work was not on the headers: every Segue 1 curve must
      lie above the combined limit, because the combination contains it. All seven
      channels now sit between 1.48 and 1.60 above it at the median — a tight band
      that made the two outliers obvious and, once fixed, corroborates the rest.

      A warning for the next reader, learned here. Two of these files are still in
      the out-of-order quarantine, and `numpy.interp` on an unsorted array returns
      nonsense without complaining. Reading `magic_2022_segue1_ann_tautau` that way
      produced an apparent impossible crossing that does not exist. Sort by mass,
      and convert the unit, before comparing anything: `magic_2014_segue1_ann_bb`
      and `..._dec_bb` carry mass in TeV where their twelve siblings use GeV.

      The archive is being completed as the review goes. The paper reports nine
      channels for five subjects — the combination and its four dSphs, all drawn
      in Fig. 4 — which is 45 curves. Thirty were held at the start. `tt` was
      digitised for all five during this review, and `gammagamma` for the
      combination, bringing it to 36. Deliberately not taken: the four per-target
      `gammagamma` curves, MD judging them not worth the transcription — it is a
      line search and those curves are noise-dominated. Still absent for want of
      the work: mumu, WW, ZZ, hh and bb for Ursa Major II, which holds three of
      the nine. Draco's H0 median curves (Fig. 2) are not transcribed while Coma
      Berenices' (Fig. 3) are.

      `profile: nfw` was recorded on all 34, from Sec. 8 — the J-factors of [15]
      assume Navarro-Frenk-White, and the paper names Einasto and Burkert as the
      alternatives it did not take. Filling it meant loosening the filename rule:
      the archive's convention had been that a stated profile must appear in the
      name, which made a profile read from a paper impossible to record.

      One inconsistency belongs to the paper: the caption of Fig. 3 says 49.8 h of
      Coma Berenices data, while Table 1, the abstract and Sec. 4 say 49.5 h.

      Left for a later eye: the four median curves run above the observed limits by
      a factor growing to 2.3 at tens of TeV, where Fig. 3 shows the two nearly
      touching.
    decisions:
      magic_2022_multidsph_ann_mumu.ecsv: >
        Held the Coma Berenices curve, byte-identical to that target's own file and
        weaker than Segue 1 alone at every mass, which a combination containing
        Segue 1 cannot be. Re-digitised from the mu+mu- panel of Fig. 4. The new
        curve lies below Segue 1 over 98% of the range and below Draco and Coma
        Berenices everywhere.
      magic_2022_comaberenices_ann_mumu.ecsv: >
        The correct file of what was an identical pair. Kept unchanged.
      magic_2022_multidsph_ann_tt.ecsv: >
        New. Digitised from the t-tbar panel of Fig. 4, with the four dSph curves
        of the same panel. The channel was absent for every subject though the
        paper reports it. Each individual lies above this combined curve over the
        whole range, and the ratios reproduce those of the channels already held:
        Segue 1 1.61 against 1.59 in bb, Draco 11.2 against 12.7, Coma Berenices
        9.5 against 9.4. The curves begin at 185-200 GeV, just above the top quark
        mass, as the channel requires.
      magic_2022_multidsph_ann_gammagamma.ecsv: >
        New. Digitised from the gamma-gamma panel of Fig. 4. A line search, so the
        curve is jagged where the others are smooth, and its limits are two orders
        of magnitude stronger — which is why the paper sets this channel aside when
        it names tautau as the one closest to the thermal relic. Two points came
        out of the digitiser in the wrong order and were sorted into place; both
        fall smoothly between their neighbours.
      magic_2022_segue1_ann_WW.ecsv: >
        Was stronger than the combined WW limit at every mass, by 1.3 to 3.6, which
        the combination containing it forbids. Re-digitised from Fig. 4; the new
        curve sits 1.58 above the combined at the median, in line with the other
        six channels. The containment-band columns were dropped with the old curve:
        they were digitised beside it and cannot be trusted apart from it.
      magic_2022_segue1_ann_tautau.ecsv: >
        Sound, and kept with its containment bands. Its lowest-mass point sat as the
        last row of the file, which is the whole of what was wrong; an independent
        re-digitisation during this review agreed with it to within 20%, so the rows
        were sorted and no value changed. An earlier reading of this file as an
        impossible curve was an artefact of interpolating it unsorted.
      magic_2022_segue1_ann_bb.ecsv: >
        Kept as it is, with its containment bands. An independent re-digitisation
        agrees to within 16% above 300 GeV and diverges only below it, where the
        archived file stops at 122 GeV. Not enough to justify discarding the bands.
      magic_2022_comaberenices_ann_WW_sens_median.ecsv: >
        `confidence: "Median"` is not a confidence level: Fig. 3 plots the 95% CL
        upper limit, so 0.95. And `statement` is `sensitivity` — this is the median
        of 300 realisations of the null hypothesis. Renamed to carry `_sens`.
      magic_2022_comaberenices_ann_bb_sens_median.ecsv: >
        Same as the WW median: confidence 0.95, statement sensitivity, renamed.
      magic_2022_comaberenices_ann_mumu_sens_median.ecsv: >
        Same as the WW median: confidence 0.95, statement sensitivity, renamed.
      magic_2022_comaberenices_ann_tautau_sens_median.ecsv: >
        Same as the WW median: confidence 0.95, statement sensitivity, renamed.
