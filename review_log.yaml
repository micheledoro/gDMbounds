# Paper-by-paper review log.
#
# WRITE HERE, READ IN DATA_REVIEW.md. This file is kept by hand; DATA_REVIEW.md
# is generated from the data *and* from this log, so anything written directly
# into that document is erased the next time the tool runs.
#
# The unit is the paper, not the bound file: one entry settles every curve
# transcribed from that paper. Key an entry by the paper's arXiv id where it has
# one and by its DOI otherwise — exactly the identifier DATA_REVIEW.md prints in
# the review queue.
#
#   <identifier>:
#     reviewer: initials or name
#     date: YYYY-MM-DD          # when the paper was read, not when this was typed
#     verdict: ok | corrected | open
#     notes: what was checked, and anything the next reader should know
#     decisions:                # optional, one line per file the review settled
#       <filename>.ecsv: what was decided and why
#
# verdict
#   ok         read against the paper, every curve matches, nothing to change
#   corrected  read, something was wrong, and the fix is committed
#   open       read, something is wrong, and it is not fixed yet — `notes` must
#              say what, because this is the only record of it
#
# What a review checks, per paper:
#   - the reference, DOI, arXiv id and year name the work actually cited
#   - each file's `figure` points at the figure the curve came from
#   - channel, mode, target and confidence agree with that figure
#   - `statement` distinguishes a measurement from a projection
#   - `profile` is filled in if the paper states one, and left empty only if it
#     genuinely does not
#   - `obs_time` carries a number, not a bare unit
#   - the curve itself: monotone in mass, no repeated points, no closed contour

reviewed:
  2111.15009:
    reviewer: Claude, for MD
    date: 2026-09-09
    verdict: open
    notes: |
      Read by Claude at MD's request; the findings below still want MD's
      confirmation before the files are touched, and the reviewer field should
      become his once he has checked them.

      MAGIC combined dSph search, Phys. Dark Univ. 35 (2022) 100912. Read against
      all 34 bounds. Confirmed correct: `figure: "Fig. 4"` on the per-target files
      — Fig. 4 draws Segue 1, Ursa Major II, Draco and Coma Berenices inside each
      of its nine panels, so a per-target curve does come from it; `confidence`
      0.95; `mode`; `year`; `source: multidsph-4`; and the mass range 70 GeV to
      100 TeV (the paper's 0.07-100 TeV). Two numbers in the text corroborate the
      curves: Draco's tautau minimum, 7.4e-24 at 1.2 TeV, and the combined tautau
      reaching ~1e-24 in the TeV range.

      Two curves are physically impossible as they stand and want re-digitising
      from Fig. 4; that is why this is `open`. Both are Segue 1, and the
      combined curves they contradict are the ones the paper's own text confirms.
      A swap of the two files was tested and rejected: it repairs 500 GeV - 2 TeV
      and fails at both ends.

      Not errors, but the archive is not complete for this paper: the combined
      analysis covers 9 channels and only 7 are held — `tt` and `gammagamma` are
      absent for every target. Ursa Major II has 2 of the 9 where the other three
      targets have 7. Draco's H0 median curves (Fig. 2) are not transcribed while
      Coma Berenices' (Fig. 3) are.

      One inconsistency belongs to the paper, not to us: the caption of Fig. 3
      says 49.8 h of Coma Berenices data, while Table 1, the abstract and Sec. 4
      all say 49.5 h.

      Watch when re-digitising: the four median curves run above the observed
      limits by a factor growing to 2.3 at tens of TeV, where Fig. 3 shows the two
      nearly touching. The observed Coma Berenices bb curve carries 13 points
      against the median's 48.
    decisions:
      magic_2022_multidsph_ann_mumu.ecsv: >
        Wrong file of the identical pair. It is weaker than Segue 1 alone at every
        mass, and a combination containing Segue 1 cannot be. It holds the Coma
        Berenices curve; the combined mumu limit is missing from the archive and
        must be re-transcribed from the mu+mu- panel of Fig. 4.
      magic_2022_comaberenices_ann_mumu.ecsv: >
        The correct file of the identical pair. Keep as it is.
      magic_2022_segue1_ann_WW.ecsv: >
        Stronger than the combined WW limit at every mass, by 1.5 to 3.5 — the
        combination includes Segue 1, so this cannot be. It is also stronger than
        Segue 1's own tautau limit, which no channel ordering allows. Re-digitise
        from Fig. 4.
      magic_2022_segue1_ann_tautau.ecsv: >
        Crosses the combined tautau curve: 5 times weaker at 500 GeV, 6 times
        stronger at 50 TeV. The combined curve is corroborated by the paper's
        text, so this one is the suspect. Re-digitise from Fig. 4.
      magic_2022_comaberenices_ann_WW_median.ecsv: >
        `confidence: "Median"` is not a confidence level: Fig. 3 plots the 95% CL
        upper limit, so 0.95. And `statement` must be `sensitivity` — this is the
        median of 300 realisations of the null hypothesis, which is what a
        sensitivity is. The two corrections go together.
      magic_2022_comaberenices_ann_bb_median.ecsv: >
        Same as the WW median: confidence 0.95, statement sensitivity.
      magic_2022_comaberenices_ann_mumu_median.ecsv: >
        Same as the WW median: confidence 0.95, statement sensitivity.
      magic_2022_comaberenices_ann_tautau_median.ecsv: >
        Same as the WW median: confidence 0.95, statement sensitivity.
